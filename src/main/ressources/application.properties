# ── Connexion MySQL (WAMP) ──────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/easyloc?useSSL=false&serverTimezone=Africa/Algiers&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
# Vide par défaut sur WAMP :
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# validate : car tu as déjà créé les tables manuellement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Configuration du Serveur ─────────────────────────────────
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always


spring.security.user.name=admin
spring.security.user.password=admin

# ── JSON & Dates ─────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ── Sécurité & Uploads ───────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ── Logs ─────────────────────────────────────────────────────
logging.level.com.easyloc=DEBUG


# Exposer tous les endpoints (health, info, beans, env, etc.)
management.endpoints.web.exposure.include=*

# Afficher les détails de la base de données et du disque dans /health
management.endpoint.health.show-details=always

